name: Ubuntu 26.04 check (temporary)

on:
  pull_request:
    branches: [ main ]

jobs:
  linux:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build and test
        run: |
          dotnet build
          dotnet test --no-build

      - name: Publish
        run: dotnet publish SmartCopy.App/SmartCopy.App.csproj -p:PublishProfile=linux-x64 -p:Version=0.0.0

      - name: Install AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          PUBLISH_DIR="artifacts/publish/SmartCopy.App/release_linux-x64"
          mkdir -p AppDir
          cp "$PUBLISH_DIR/SmartCopy" AppDir/
          chmod +x AppDir/SmartCopy
          cp SmartCopy.UI/Assets/icon.png AppDir/smartcopy.png
          cp .github/appimage/SmartCopy.desktop AppDir/
          cp .github/appimage/AppRun AppDir/
          chmod +x AppDir/AppRun
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool AppDir SmartCopy-test-x86_64.AppImage
          ls -l SmartCopy-test-x86_64.AppImage
